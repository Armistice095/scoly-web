<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171b24" media="(prefers-color-scheme: dark)" />
		<meta name="application-name" content="Scoly" />
		<meta name="apple-mobile-web-app-title" content="Scoly" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:wght@400;500&display=swap"
		/>

	<body data-sveltekit-preload-data="hover">
